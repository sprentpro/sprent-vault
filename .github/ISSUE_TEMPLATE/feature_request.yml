name: Feature request
description: Propose a change to the program or the accounting package
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you suggest, including new instructions, accounts or parameters.
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Interface and accounting impact
      description: IDL changes, account layout changes, and effects on share pricing or fees.
